<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Zero Hour Game</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: rgba(15, 23, 42, 0.94);
        --line: rgba(148, 163, 184, 0.2);
        --blue: #38bdf8;
        --green: #4ade80;
        --red: #f87171;
        --amber: #fbbf24;
        --text: #e5e7eb;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #11233d, var(--bg));
        color: var(--text);
        font-family: Arial, sans-serif;
      }

      #game-shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 16px;
        min-height: 100vh;
        padding: 18px;
      }

      #game-area {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      #hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 18px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      .tag {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(56, 189, 248, 0.4);
        background: rgba(56, 189, 248, 0.12);
        color: var(--blue);
        font-size: 12px;
        font-weight: bold;
        text-transform: uppercase;
      }

      #battlefield {
        position: relative;
        flex: 1;
        min-height: 620px;
        border-radius: 18px;
        overflow: hidden;
        background: linear-gradient(135deg, #123348, #0d1f2d);
        border: 1px solid var(--line);
      }

      #mapGrid {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        grid-template-rows: repeat(12, minmax(0, 1fr));
        gap: 2px;
        padding: 12px;
        z-index: 1;
      }

      .tile {
        border-radius: 6px;
        border: 1px solid rgba(255,255,255,0.05);
      }

      .grass { background: linear-gradient(135deg, #2d5d4d, #214b3d); }
      .road { background: linear-gradient(135deg, #676d76, #404b5d); }
      .water { background: linear-gradient(135deg, #0b3c60, #0b2c4b); }
      .forest { background: linear-gradient(135deg, #1f5f3b, #17482f); }
      .base { background: linear-gradient(135deg, #57908f, #3e6d72); }
      .rock { background: linear-gradient(135deg, #67768b, #4f5f75); }

      .unit {
        position: absolute;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: 3px solid rgba(255,255,255,0.8);
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: bold;
        transform: translate(-50%, -50%);
        z-index: 2;
        box-shadow: 0 0 18px rgba(0,0,0,0.35);
      }

      .unit.me { box-shadow: 0 0 18px rgba(56, 189, 248, 0.9); }
      .unit.enemy { box-shadow: 0 0 18px rgba(248, 113, 113, 0.75); }

      .unit .name {
        display: block;
        margin-top: 32px;
        background: rgba(15, 23, 42, 0.8);
        padding: 2px 5px;
        border-radius: 999px;
        font-size: 9px;
        white-space: nowrap;
      }

      #sidebar {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      button {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        border: 0;
        border-radius: 10px;
        padding: 10px 12px;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="game-shell">
      <div id="game-area">
        <div id="hud">
          <div>
            <span class="tag">Zero Hour</span>
            <span class="tag" id="mapName">Map</span>
            <span class="tag" id="heureLabel">Heure H + 00:00:00</span>
          </div>
          <span class="tag" id="stateLabel">Partie lancée</span>
        </div>

        <div id="battlefield">
          <div id="mapGrid"></div>
          <div id="unitsLayer"></div>
        </div>
      </div>

      <aside id="sidebar">
        <div class="panel">
          <h3>Joueurs</h3>
          <ul id="playersList"></ul>
        </div>

        <div class="panel">
          <h3>Actions</h3>
          <button id="endMatchBtn">Terminer la partie</button>
        </div>
      </aside>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const roomId = params.get('roomId');
      const userId = params.get('userId');
      const selectedMapId = params.get('mapId') || 'generals_arena';

      const mapName = document.getElementById('mapName');
      const heureLabel = document.getElementById('heureLabel');
      const stateLabel = document.getElementById('stateLabel');
      const mapGrid = document.getElementById('mapGrid');
      const unitsLayer = document.getElementById('unitsLayer');
      const playersList = document.getElementById('playersList');

      const mapCatalog = {
        generals_arena: {
          name: 'Generals Arena',
          tiles: [
            ['grass','grass','grass','grass','grass','road','road','grass','grass','grass','grass','grass'],
            ['grass','forest','grass','grass','grass','road','road','grass','forest','grass','grass','grass'],
            ['grass','grass','water','water','water','road','road','water','water','grass','grass','grass'],
            ['grass','grass','water','water','water','road','road','water','water','grass','grass','grass'],
            ['grass','grass','grass','grass','grass','road','road','grass','grass','grass','grass','grass'],
            ['road','road','road','road','road','base','base','road','road','road','road','road'],
            ['grass','grass','grass','grass','grass','road','road','grass','grass','grass','grass','grass'],
            ['grass','grass','water','water','water','road','road','water','water','grass','grass','grass'],
            ['grass','grass','water','water','water','road','road','water','water','grass','grass','grass'],
            ['grass','forest','grass','grass','grass','road','road','grass','forest','grass','grass','grass'],
            ['grass','grass','grass','grass','grass','road','road','grass','grass','grass','grass','grass'],
            ['grass','grass','grass','grass','grass','road','road','grass','grass','grass','grass','grass']
          ]
        },
        delta_ridge: {
          name: 'Delta Ridge',
          tiles: [
            ['grass','grass','grass','grass','forest','forest','forest','grass','grass','grass','grass','grass'],
            ['road','road','road','road','road','road','road','road','road','road','grass','grass'],
            ['grass','grass','forest','forest','water','water','water','forest','grass','road','grass','grass'],
            ['grass','grass','forest','forest','water','water','water','forest','grass','road','grass','grass'],
            ['grass','grass','grass','grass','forest','forest','forest','grass','grass','road','grass','grass'],
            ['grass','grass','grass','road','road','base','base','road','road','road','grass','grass'],
            ['grass','grass','grass','road','road','road','road','road','road','road','grass','grass'],
            ['grass','grass','forest','forest','water','water','water','forest','grass','road','grass','grass'],
            ['grass','grass','forest','forest','water','water','water','forest','grass','road','grass','grass'],
            ['grass','grass','grass','grass','forest','forest','forest','grass','grass','road','grass','grass'],
            ['grass','grass','grass','grass','grass','road','road','grass','grass','grass','grass','grass'],
            ['grass','grass','grass','grass','grass','road','road','grass','grass','grass','grass','grass']
          ]
        },
        iron_harbor: {
          name: 'Iron Harbor',
          tiles: [
            ['grass','grass','grass','grass','grass','road','road','grass','grass','grass','forest','forest'],
            ['grass','forest','grass','grass','grass','road','road','grass','grass','grass','forest','forest'],
            ['grass','grass','water','grass','road','road','road','road','grass','grass','grass','grass'],
            ['grass','grass','water','grass','road','road','road','road','grass','grass','grass','grass'],
            ['grass','grass','grass','rock','rock','road','road','rock','rock','grass','grass','grass'],
            ['road','road','road','road','road','base','base','road','road','road','road','road'],
            ['grass','grass','grass','rock','rock','road','road','rock','rock','grass','grass','grass'],
            ['grass','grass','grass','grass','road','road','road','road','grass','grass','water','grass'],
            ['grass','grass','grass','grass','road','road','road','road','grass','grass','water','grass'],
            ['grass','forest','grass','grass','grass','road','road','grass','forest','grass','grass','grass'],
            ['grass','grass','grass','grass','grass','road','road','grass','grass','grass','forest','forest'],
            ['grass','grass','grass','grass','grass','road','road','grass','grass','grass','forest','forest']
          ]
        }
      };

      function renderMap() {
        const currentMap = mapCatalog[selectedMapId] || mapCatalog.generals_arena;
        mapName.textContent = currentMap.name;
        mapGrid.innerHTML = currentMap.tiles.flatMap((row) => row.map((tile) => `<div class="tile ${tile}"></div>`)).join('');
      }

      function formatHeure(totalSeconds) {
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        return `Heure H + ${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }

      function startHeureH() {
        const start = Date.now();
        setInterval(() => {
          const elapsed = Math.floor((Date.now() - start) / 1000);
          heureLabel.textContent = formatHeure(elapsed);
        }, 1000);
      }

      function renderPlayers(room) {
        const players = room && room.players ? [...room.players.values()] : [
          { username: 'Joueur 1', team: 'blue', army: 'US', color: 'blue' },
          { username: 'Joueur 2', team: 'red', army: 'China', color: 'red' }
        ];

        playersList.innerHTML = players.map((player) => {
          const color = {
            blue: '#38bdf8',
            red: '#f87171',
            green: '#34d399',
            gold: '#fbbf24'
          }[player.color] || '#38bdf8';

          return `
            <li>
              <div style="display:flex;align-items:center;gap:8px;">
                <span style="width:18px;height:18px;border-radius:50%;background:${color};display:inline-block;"></span>
                <span>${player.username || 'Joueur'}</span>
              </div>
              <span>${player.army || 'US'} / ${player.team || 'blue'}</span>
            </li>
          `;
        }).join('');
      }

      function renderUnits() {
        const units = [
          { x: 18, y: 22, color: '#38bdf8', label: 'A1', me: true, name: 'Alpha' },
          { x: 52, y: 70, color: '#f87171', label: 'E1', me: false, name: 'Enemy' },
          { x: 68, y: 38, color: '#4ade80', label: 'A2', me: true, name: 'Bravo' }
        ];

        unitsLayer.innerHTML = units.map((u) => `
          <div class="unit ${u.me ? 'me' : 'enemy'}" style="left:${u.x}%; top:${u.y}%; background:${u.color};">
            <span>${u.label}</span>
            <span class="name">${u.name}</span>
          </div>
        `).join('');
      }

      renderMap();
      startHeureH();
      renderPlayers();
      renderUnits();

      const ws = new WebSocket('ws://localhost:3010');

      ws.addEventListener('open', () => {
        if (userId) {
          ws.send(JSON.stringify({ type: 'register', userId, username: 'Joueur' }));
        }

        if (roomId) {
          ws.send(JSON.stringify({ type: 'join-room', roomId, userId, username: 'Joueur' }));
        }
      });

      ws.addEventListener('message', (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'joined-room' || data.type === 'room-update' || data.type === 'match-started') {
          renderPlayers(data.room);
        }
      });

      document.getElementById('endMatchBtn').addEventListener('click', () => {
        ws.send(JSON.stringify({ type: 'end-match', winnerId: userId }));
        stateLabel.textContent = 'Partie terminée';
      });
    </script>
  </body>
</html>
