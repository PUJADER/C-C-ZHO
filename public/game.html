<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Zero Hour RTS</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: rgba(15, 23, 42, 0.94);
        --line: rgba(148, 163, 184, 0.22);
        --blue: #38bdf8;
        --red: #f87171;
        --green: #4ade80;
        --gold: #fbbf24;
        --text: #e5e7eb;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #11233d, var(--bg));
        color: var(--text);
        font-family: Arial, sans-serif;
      }

      #game-shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 16px;
        min-height: 100vh;
        padding: 18px;
      }

      #game-area {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      #hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 18px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      .tag {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(56, 189, 248, 0.4);
        background: rgba(56, 189, 248, 0.12);
        color: var(--blue);
        font-size: 12px;
        font-weight: bold;
        text-transform: uppercase;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #10263a;
        border: 1px solid var(--line);
        border-radius: 18px;
      }

      #sidebar {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
      }

      .panel h3 {
        margin-top: 0;
      }

      button {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        border: 0;
        border-radius: 10px;
        padding: 10px 12px;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
        margin-top: 10px;
      }

      #selectedInfo {
        line-height: 1.5;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="game-shell">
      <div id="game-area">
        <div id="hud">
          <div>
            <span class="tag">Zero Hour</span>
            <span class="tag" id="mapName">Map</span>
            <span class="tag" id="heureLabel">Heure H + 00:00:00</span>
          </div>
          <span class="tag" id="stateLabel">Partie lancée</span>
        </div>

        <canvas id="battlefield" width="1200" height="720"></canvas>
      </div>

      <aside id="sidebar">
        <div class="panel">
          <h3>Unité sélectionnée</h3>
          <div id="selectedInfo">Aucune</div>
        </div>

        <div class="panel">
          <h3>Commandes</h3>
          <button id="spawnUnitBtn">Construire unité</button>
          <button id="spawnBuilderBtn">Construire ouvrier</button>
          <button id="endMatchBtn">Terminer la partie</button>
        </div>

        <div class="panel">
          <h3>État</h3>
          <div id="statusInfo">Joueur bleu</div>
        </div>
      </aside>
    </div>

    <script>
      const canvas = document.getElementById('battlefield');
      const ctx = canvas.getContext('2d');
      const mapName = document.getElementById('mapName');
      const heureLabel = document.getElementById('heureLabel');
      const stateLabel = document.getElementById('stateLabel');
      const selectedInfo = document.getElementById('selectedInfo');
      const statusInfo = document.getElementById('statusInfo');

      const params = new URLSearchParams(window.location.search);
      const roomId = params.get('roomId');
      const userId = params.get('userId');
      const selectedMapId = params.get('mapId') || 'generals_arena';

      const TEAM = {
        BLUE: 'blue',
        RED: 'red'
      };

      const resources = {
        blue: { ore: 220, power: 60 },
        red: { ore: 220, power: 60 }
      };

      const unitCosts = {
        infantry: { ore: 45, power: 12 },
        worker: { ore: 25, power: 8 }
      };

      const world = {
        width: canvas.width,
        height: canvas.height,
        mapName: 'Zero Hour Arena',
        selectedId: null,
        lastTime: 0,
        spawnClock: 0
      };

      const buildings = [
        { id: 'b1', type: 'hq', team: TEAM.BLUE, x: 180, y: 180, w: 140, h: 120, hp: 500, maxHp: 500, color: '#38bdf8', queue: [] },
        { id: 'b2', type: 'hq', team: TEAM.RED, x: 930, y: 470, w: 140, h: 120, hp: 500, maxHp: 500, color: '#f87171', queue: [] },
        { id: 'b3', type: 'barracks', team: TEAM.BLUE, x: 340, y: 180, w: 110, h: 90, hp: 260, maxHp: 260, color: '#38bdf8', queue: [] },
        { id: 'b4', type: 'barracks', team: TEAM.RED, x: 1010, y: 560, w: 110, h: 90, hp: 260, maxHp: 260, color: '#f87171', queue: [] }
      ];

      const units = [
        { id: 'u1', type: 'infantry', team: TEAM.BLUE, x: 210, y: 240, hp: 100, maxHp: 100, speed: 60, range: 42, color: '#38bdf8', name: 'Soldat', order: null, target: null },
        { id: 'u2', type: 'worker', team: TEAM.BLUE, x: 270, y: 200, hp: 80, maxHp: 80, speed: 58, range: 26, color: '#4ade80', name: 'Ouvrier', order: null, target: null },
        { id: 'u3', type: 'infantry', team: TEAM.RED, x: 990, y: 520, hp: 100, maxHp: 100, speed: 60, range: 42, color: '#f87171', name: 'Ennemi', order: null, target: null },
        { id: 'u4', type: 'worker', team: TEAM.RED, x: 900, y: 560, hp: 80, maxHp: 80, speed: 58, range: 26, color: '#fbbf24', name: 'Ouvrier', order: null, target: null }
      ];

      const mapCatalog = {
        generals_arena: {
          name: 'Generals Arena',
          tiles: [
            ['grass','grass','grass','grass','grass','road','road','grass','grass','grass','grass','grass'],
            ['grass','forest','grass','grass','grass','road','road','grass','forest','grass','grass','grass'],
            ['grass','grass','water','water','water','road','road','water','water','grass','grass','grass'],
            ['grass','grass','water','water','water','road','road','water','water','grass','grass','grass'],
            ['grass','grass','grass','grass','grass','road','road','grass','grass','grass','grass','grass'],
            ['road','road','road','road','road','base','base','road','road','road','road','road'],
            ['grass','grass','grass','grass','grass','road','road','grass','grass','grass','grass','grass'],
            ['grass','grass','water','water','water','road','road','water','water','grass','grass','grass'],
            ['grass','grass','water','water','water','road','road','water','water','grass','grass','grass'],
            ['grass','forest','grass','grass','grass','road','road','grass','forest','grass','grass','grass'],
            ['grass','grass','grass','grass','grass','road','road','grass','grass','grass','grass','grass'],
            ['grass','grass','grass','grass','grass','road','road','grass','grass','grass','grass','grass']
          ]
        }
      };

      function renderMap() {
        const currentMap = mapCatalog[selectedMapId] || mapCatalog.generals_arena;
        mapName.textContent = currentMap.name;
      }

      function formatHeure(seconds) {
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;
        return `Heure H + ${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      function startHeureH() {
        const start = Date.now();
        setInterval(() => {
          const elapsed = Math.floor((Date.now() - start) / 1000);
          heureLabel.textContent = formatHeure(elapsed);
        }, 1000);
      }

      function getUnitById(id) {
        return units.find(u => u.id === id) || null;
      }

      function getNearestEnemy(from) {
        let nearest = null;
        let best = Infinity;

        for (const u of units) {
          if (u.team === from.team) continue;
          const d = Math.hypot(u.x - from.x, u.y - from.y);
          if (d < best) {
            best = d;
            nearest = u;
          }
        }

        for (const b of buildings) {
          if (b.team === from.team) continue;
          const d = Math.hypot(b.x - from.x, b.y - from.y);
          if (d < best) {
            best = d;
            nearest = b;
          }
        }

        return nearest;
      }

      function canAfford(team, type) {
        const cost = unitCosts[type];
        return resources[team].ore >= cost.ore && resources[team].power >= cost.power;
      }

      function payCost(team, type) {
        const cost = unitCosts[type];
        resources[team].ore -= cost.ore;
        resources[team].power -= cost.power;
      }

      function spawnUnit(team, type, x = null, y = null) {
        const base = buildings.find(b => b.team === team && b.type === 'hq');
        if (!base) return;

        const unit = {
          id: 'u_' + Date.now() + Math.random().toString(16).slice(2),
          type,
          team,
          x: x ?? (base.x + 70 + Math.random() * 30),
          y: y ?? (base.y + 80 + Math.random() * 30),
          hp: type === 'worker' ? 80 : 100,
          maxHp: type === 'worker' ? 80 : 100,
          speed: type === 'worker' ? 58 : 62,
          range: type === 'worker' ? 26 : 42,
          color: team === 'blue' ? '#38bdf8' : '#f87171',
          name: type === 'worker' ? 'Ouvrier' : 'Soldat',
          order: null,
          target: null
        };

        units.push(unit);
      }

      function pushProduction(buildingId, unitType) {
        const building = buildings.find(b => b.id === buildingId);
        if (!building) return;
        if (!canAfford(building.team, unitType)) return;

        payCost(building.team, unitType);

        building.queue.push({
          type: unitType,
          timer: unitType === 'worker' ? 1.8 : 2.4
        });
      }

      function updateProduction(dt) {
        for (const building of buildings) {
          if (!building.queue.length) continue;

          const job = building.queue[0];
          job.timer -= dt;

          if (job.timer <= 0) {
            building.queue.shift();
            const base = buildings.find(b => b.team === building.team && b.type === 'hq');
            if (!base) continue;
            spawnUnit(building.team, job.type, base.x + 70 + Math.random() * 30, base.y + 80 + Math.random() * 30);
          }
        }
      }

      function drawTerrain() {
        ctx.fillStyle = '#123348';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#204b3a';
        for (let i = 0; i < 5; i++) {
          ctx.fillRect(60 + i * 190, 80 + (i % 2) * 180, 180, 90);
        }

        ctx.fillStyle = '#2d5d4d';
        for (let i = 0; i < 12; i++) {
          ctx.fillRect(i * 95, 0, 20, canvas.height);
        }

        ctx.fillStyle = '#0d395e';
        ctx.fillRect(0, 650, canvas.width, 100);
        ctx.fillStyle = '#0a2d49';
        ctx.fillRect(0, 680, canvas.width, 80);

        ctx.fillStyle = '#4b5563';
        ctx.fillRect(200, 560, 300, 18);
        ctx.fillRect(760, 160, 280, 18);
      }

      function drawHud() {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(20, 20, 210, 90);

        ctx.fillStyle = '#e5e7eb';
        ctx.font = 'bold 14px Arial';
        ctx.fillText('Blue', 30, 42);
        ctx.fillText('Ore: ' + resources.blue.ore, 30, 58);
        ctx.fillText('Power: ' + resources.blue.power, 30, 74);

        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(970, 20, 210, 90);

        ctx.fillStyle = '#fca5a5';
        ctx.fillText('Red', 980, 42);
        ctx.fillText('Ore: ' + resources.red.ore, 980, 58);
        ctx.fillText('Power: ' + resources.red.power, 980, 74);
      }

      function drawBuilding(b) {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, b.h);

        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.strokeRect(b.x, b.y, b.w, b.h);

        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(b.x, b.y - 16, b.w, 10);

        ctx.fillStyle = '#86efac';
        const p = (b.hp / b.maxHp) * 100;
        ctx.fillRect(b.x, b.y - 16, (b.w * p) / 100, 10);
      }

      function drawUnit(u) {
        ctx.beginPath();
        ctx.fillStyle = u.color;
        ctx.arc(u.x, u.y, 16, 0, Math.PI * 2);
        ctx.fill();

        if (u.type === 'worker') {
          ctx.fillStyle = '#fff';
          ctx.fillRect(u.x - 8, u.y - 20, 16, 6);
        }

        if (u.type === 'infantry') {
          ctx.fillStyle = '#111827';
          ctx.fillRect(u.x - 10, u.y - 20, 20, 6);
        }

        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(u.x - 20, u.y + 18, 40, 6);

        ctx.fillStyle = '#86efac';
        const p = (u.hp / u.maxHp) * 100;
        ctx.fillRect(u.x - 20, u.y + 18, (40 * p) / 100, 6);

        if (world.selectedId === u.id) {
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(u.x, u.y, 22, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      function drawSelection() {
        if (!world.selectedId) return;

        const selected = getUnitById(world.selectedId);
        if (!selected) return;

        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(selected.x - 22, selected.y - 22, 44, 44);
      }

      function updateSelectedInfo() {
        const unit = getUnitById(world.selectedId);
        if (!unit) {
          selectedInfo.innerHTML = 'Aucune';
          return;
        }

        selectedInfo.innerHTML = `
          <strong>${unit.name}</strong><br>
          Type: ${unit.type}<br>
          Team: ${unit.team}<br>
          HP: ${unit.hp}/${unit.maxHp}<br>
          Position: ${Math.round(unit.x)}, ${Math.round(unit.y)}
        `;
      }

      function setMoveOrder(x, y) {
        const unit = getUnitById(world.selectedId);
        if (!unit) return;
        unit.order = { type: 'move', x, y };
        unit.target = null;
      }

      function setAttackOrder(target) {
        const unit = getUnitById(world.selectedId);
        if (!unit) return;
        unit.order = { type: 'attack', targetId: target.id };
        unit.target = target;
      }

      function handleClick(event) {
        const rect = canvas.getBoundingClientRect();
        const x = (event.clientX - rect.left) * (canvas.width / rect.width);
        const y = (event.clientY - rect.top) * (canvas.height / rect.height);

        if (event.button === 0) {
          const unitHit = units.find(u => Math.hypot(u.x - x, u.y - y) < 18);
          if (unitHit) {
            world.selectedId = unitHit.id;
            updateSelectedInfo();
            return;
          }

          const buildingHit = buildings.find(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
          if (buildingHit) {
            world.selectedId = null;
            updateSelectedInfo();
            return;
          }

          world.selectedId = null;
          updateSelectedInfo();
          return;
        }

        if (event.button === 2) {
          if (!world.selectedId) return;
          const selected = getUnitById(world.selectedId);
          if (!selected) return;

          const enemyUnit = units.find(u => u.team !== selected.team && Math.hypot(u.x - x, u.y - y) < 22);
          if (enemyUnit) {
            setAttackOrder(enemyUnit);
            updateSelectedInfo();
            return;
          }

          const enemyBuilding = buildings.find(b => b.team !== selected.team && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
          if (enemyBuilding) {
            setAttackOrder(enemyBuilding);
            updateSelectedInfo();
            return;
          }

          setMoveOrder(x, y);
          updateSelectedInfo();
        }
      }

      function updateUnits(dt) {
        for (const unit of units) {
          const enemy = getNearestEnemy(unit);

          if (!enemy) continue;

          if (!unit.order) {
            const dx = enemy.x - unit.x;
            const dy = enemy.y - unit.y;
            const dist = Math.hypot(dx, dy);

            if (dist > unit.range) {
              const a = Math.atan2(dy, dx);
              unit.x += Math.cos(a) * unit.speed * dt;
              unit.y += Math.sin(a) * unit.speed * dt;
            } else {
              enemy.hp -= 15 * dt;
            }
            continue;
          }

          if (unit.order.type === 'move') {
            const dx = unit.order.x - unit.x;
            const dy = unit.order.y - unit.y;
            const dist = Math.hypot(dx, dy);

            if (dist > 5) {
              const angle = Math.atan2(dy, dx);
              unit.x += Math.cos(angle) * unit.speed * dt;
              unit.y += Math.sin(angle) * unit.speed * dt;
            } else {
              unit.order = null;
            }
          }

          if (unit.order.type === 'attack') {
            let target = null;

            if (unit.order.targetId) {
              target = units.find(u => u.id === unit.order.targetId) || buildings.find(b => b.id === unit.order.targetId);
            }

            if (!target) {
              unit.order = null;
              continue;
            }

            const dx = target.x - unit.x;
            const dy = target.y - unit.y;
            const dist = Math.hypot(dx, dy);

            if (dist > unit.range) {
              const angle = Math.atan2(dy, dx);
              unit.x += Math.cos(angle) * unit.speed * dt;
              unit.y += Math.sin(angle) * unit.speed * dt;
            } else {
              target.hp -= 20 * dt;

              if (target.hp <= 0 && 'type' in target && target.type === 'hq') {
                target.hp = target.maxHp;
              }

              if (target.hp <= 0 && !('type' in target)) {
                const idx = units.findIndex(u => u.id === target.id);
                if (idx >= 0) units.splice(idx, 1);
              }
            }
          }
        }

        for (let i = units.length - 1; i >= 0; i--) {
          if (units[i].hp <= 0) units.splice(i, 1);
        }

        if (world.selectedId) {
          const selected = getUnitById(world.selectedId);
          if (!selected) world.selectedId = null;
        }
      }

      function enemyAI(dt) {
        const redUnits = units.filter(u => u.team === TEAM.RED);
        const blueUnits = units.filter(u => u.team === TEAM.BLUE);

        if (redUnits.length < 4 && resources.red.ore >= unitCosts.infantry.ore && resources.red.power >= unitCosts.infantry.power) {
          const barracks = buildings.find(b => b.team === TEAM.RED && b.type === 'barracks');
          if (barracks) pushProduction(barracks.id, 'infantry');
        }

        for (const enemy of redUnits) {
          const target = blueUnits[0] || buildings.find(b => b.team === TEAM.BLUE && b.type === 'hq');
          if (!target) continue;

          const dx = target.x - enemy.x;
          const dy = target.y - enemy.y;
          const dist = Math.hypot(dx, dy);

          if (dist > enemy.range) {
            const angle = Math.atan2(dy, dx);
            enemy.x += Math.cos(angle) * enemy.speed * dt;
            enemy.y += Math.sin(angle) * enemy.speed * dt;
          } else {
            target.hp -= 18 * dt;
            if (target.hp <= 0 && 'type' in target && target.type === 'hq') {
              target.hp = target.maxHp;
            }
          }
        }
      }

      function render() {
        drawTerrain();
        drawHud();
        for (const b of buildings) drawBuilding(b);
        for (const u of units) drawUnit(u);
        drawSelection();
      }

      document.getElementById('spawnUnitBtn').addEventListener('click', () => {
        const barracks = buildings.find(b => b.team === TEAM.BLUE && b.type === 'barracks');
        if (barracks) pushProduction(barracks.id, 'infantry');
      });

      document.getElementById('spawnBuilderBtn').addEventListener('click', () => {
        const barracks = buildings.find(b => b.team === TEAM.BLUE && b.type === 'barracks');
        if (barracks) pushProduction(barracks.id, 'worker');
      });

      document.getElementById('endMatchBtn').addEventListener('click', () => {
        stateLabel.textContent = 'Partie terminée';
      });

      canvas.addEventListener('mousedown', handleClick);
      canvas.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        handleClick(e);
      });

      mapName.textContent = 'Zero Hour Arena';
      statusInfo.textContent = 'Joueur bleu';
      startHeureH();
      renderMap();
      updateSelectedInfo();

      const ws = new WebSocket('ws://localhost:3010');
      ws.addEventListener('open', () => {
        if (roomId && userId) {
          ws.send(JSON.stringify({ type: 'register', userId, username: 'Joueur' }));
        }
      });

      function gameLoop(ts) {
        const dt = Math.min((ts - (world.lastTime || ts)) / 1000, 0.033);
        world.lastTime = ts;

        updateProduction(dt);
        enemyAI(dt);
        updateUnits(dt);
        render();
        updateSelectedInfo();

        requestAnimationFrame(gameLoop);
      }

      requestAnimationFrame(gameLoop);
    </script>
  </body>
</html>
