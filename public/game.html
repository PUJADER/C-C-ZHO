<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Zero Hour RTS</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: rgba(15, 23, 42, 0.94);
        --line: rgba(148, 163, 184, 0.22);
        --blue: #38bdf8;
        --red: #f87171;
        --green: #4ade80;
        --gold: #fbbf24;
        --text: #e5e7eb;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #11233d, var(--bg));
        color: var(--text);
        font-family: Arial, sans-serif;
      }

      #game-shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 16px;
        min-height: 100vh;
        padding: 18px;
      }

      #game-area {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      #hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 18px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      .tag {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(56, 189, 248, 0.4);
        background: rgba(56, 189, 248, 0.12);
        color: var(--blue);
        font-size: 12px;
        font-weight: bold;
        text-transform: uppercase;
      }

      #battlefield {
        position: relative;
        flex: 1;
        min-height: 620px;
        border-radius: 18px;
        overflow: hidden;
        background: linear-gradient(135deg, #123348, #0d1f2d);
        border: 1px solid var(--line);
      }

      #mapGrid {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        grid-template-rows: repeat(12, minmax(0, 1fr));
        gap: 2px;
        padding: 12px;
        z-index: 1;
      }

      .tile {
        border-radius: 6px;
        border: 1px solid rgba(255,255,255,0.05);
      }

      .grass { background: linear-gradient(135deg, #2d5d4d, #214b3d); }
      .road { background: linear-gradient(135deg, #676d76, #404b5d); }
      .water { background: linear-gradient(135deg, #0b3c60, #0b2c4b); }
      .forest { background: linear-gradient(135deg, #1f5f3b, #17482f); }
      .base { background: linear-gradient(135deg, #57908f, #3e6d72); }
      .rock { background: linear-gradient(135deg, #67768b, #4f5f75); }

      .unit {
        position: absolute;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: 3px solid rgba(255,255,255,0.8);
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: bold;
        transform: translate(-50%, -50%);
        z-index: 2;
        box-shadow: 0 0 18px rgba(0,0,0,0.35);
        cursor: pointer;
      }

      .unit.selected {
        border-color: white;
        box-shadow: 0 0 0 3px rgba(255,255,255,0.7), 0 0 20px rgba(56,189,248,0.9);
      }

      .unit.blue { background: #38bdf8; }
      .unit.red { background: #f87171; }
      .unit.green { background: #4ade80; }
      .unit.gold { background: #fbbf24; }

      .unit .name {
        display: block;
        margin-top: 32px;
        background: rgba(15, 23, 42, 0.8);
        padding: 2px 5px;
        border-radius: 999px;
        font-size: 9px;
        white-space: nowrap;
      }

      .unit .hp {
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 9px;
        background: rgba(15,23,42,0.8);
        border-radius: 999px;
        padding: 2px 5px;
      }

      #sidebar {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .info {
        display: block;
        margin-top: 8px;
        color: #cbd5e1;
        font-size: 12px;
      }

      button {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        border: 0;
        border-radius: 10px;
        padding: 10px 12px;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="game-shell">
      <div id="game-area">
        <div id="hud">
          <div>
            <span class="tag">Zero Hour</span>
            <span class="tag" id="mapName">Map</span>
            <span class="tag" id="heureLabel">Heure H + 00:00:00</span>
          </div>
          <span class="tag" id="stateLabel">Partie lancée</span>
        </div>

        <div id="battlefield">
          <div id="mapGrid"></div>
          <div id="unitsLayer"></div>
        </div>
      </div>

      <aside id="sidebar">
        <div class="panel">
          <h3>Unité sélectionnée</h3>
          <div id="selectedInfo">Aucune</div>
        </div>

        <div class="panel">
          <h3>Joueurs</h3>
          <ul id="playersList"></ul>
        </div>

        <div class="panel">
          <h3>Actions</h3>
          <button id="endMatchBtn">Terminer la partie</button>
        </div>
      </aside>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const roomId = params.get('roomId');
      const userId = params.get('userId');
      const selectedMapId = params.get('mapId') || 'generals_arena';

      const mapName = document.getElementById('mapName');
      const heureLabel = document.getElementById('heureLabel');
      const stateLabel = document.getElementById('stateLabel');
      const mapGrid = document.getElementById('mapGrid');
      const unitsLayer = document.getElementById('unitsLayer');
      const playersList = document.getElementById('playersList');
      const selectedInfo = document.getElementById('selectedInfo');

      const mapCatalog = {
        generals_arena: {
          name: 'Generals Arena',
          tiles: [
            ['grass','grass','grass','grass','grass','road','road','grass','grass','grass','grass','grass'],
            ['grass','forest','grass','grass','grass','road','road','grass','forest','grass','grass','grass'],
            ['grass','grass','water','water','water','road','road','water','water','grass','grass','grass'],
            ['grass','grass','water','water','water','road','road','water','water','grass','grass','grass'],
            ['grass','grass','grass','grass','grass','road','road','grass','grass','grass','grass','grass'],
            ['road','road','road','road','road','base','base','road','road','road','road','road'],
            ['grass','grass','grass','grass','grass','road','road','grass','grass','grass','grass','grass'],
            ['grass','grass','water','water','water','road','road','water','water','grass','grass','grass'],
            ['grass','grass','water','water','water','road','road','water','water','grass','grass','grass'],
            ['grass','forest','grass','grass','grass','road','road','grass','forest','grass','grass','grass'],
            ['grass','grass','grass','grass','grass','road','road','grass','grass','grass','grass','grass'],
            ['grass','grass','grass','grass','grass','road','road','grass','grass','grass','grass','grass']
          ]
        }
      };

      const players = [
        { username: 'Joueur 1', team: 'blue', army: 'US', color: 'blue' },
        { username: 'Joueur 2', team: 'red', army: 'China', color: 'red' }
      ];

      const units = [
        { id: 'u1', name: 'Alpha', team: 'blue', color: 'blue', type: 'infantry', hp: 100, maxHp: 100, x: 90, y: 120, speed: 42, range: 42, targetId: null },
        { id: 'u2', name: 'Bravo', team: 'blue', color: 'blue', type: 'infantry', hp: 90, maxHp: 90, x: 150, y: 220, speed: 42, range: 42, targetId: null },
        { id: 'u3', name: 'Charlie', team: 'red', color: 'red', type: 'tank', hp: 120, maxHp: 120, x: 760, y: 470, speed: 38, range: 58, targetId: null },
        { id: 'u4', name: 'Delta', team: 'red', color: 'red', type: 'infantry', hp: 82, maxHp: 82, x: 690, y: 540, speed: 43, range: 42, targetId: null }
      ];

      let selectedUnitId = null;
      let lastTime = 0;

      function renderMap() {
        const currentMap = mapCatalog[selectedMapId] || mapCatalog.generals_arena;
        mapName.textContent = currentMap.name;
        mapGrid.innerHTML = currentMap.tiles.flatMap((row) =>
          row.map((tile) => `<div class="tile ${tile}"></div>`)
        ).join('');
      }

      function renderPlayers() {
        playersList.innerHTML = players.map((p) =>
          `<li><span>${p.username}</span><span>${p.team}</span></li>`
        ).join('');
      }

      function formatHeure(totalSeconds) {
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        return `Heure H + ${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }

      function startHeureH() {
        const start = Date.now();
        setInterval(() => {
          const elapsed = Math.floor((Date.now() - start) / 1000);
          heureLabel.textContent = formatHeure(elapsed);
        }, 1000);
      }

      function getUnitById(id) {
        return units.find((u) => u.id === id) || null;
      }

      function getNearestEnemy(unit) {
        let nearest = null;
        let best = Infinity;

        for (const other of units) {
          if (other.id === unit.id) continue;
          if (other.team === unit.team) continue;
          const dist = Math.hypot(other.x - unit.x, other.y - unit.y);
          if (dist < best) {
            best = dist;
            nearest = other;
          }
        }

        return nearest;
      }

      function updateSelectedInfo() {
        const unit = getUnitById(selectedUnitId);
        if (!unit) {
          selectedInfo.textContent = 'Aucune';
          return;
        }

        selectedInfo.innerHTML = `
          <strong>${unit.name}</strong><br />
          Type: ${unit.type}<br />
          Team: ${unit.team}<br />
          HP: ${unit.hp}/${unit.maxHp}<br />
          Position: ${Math.round(unit.x)}, ${Math.round(unit.y)}
        `;
      }

      function updateUnits() {
        for (const unit of units) {
          const enemy = getNearestEnemy(unit);
          if (!enemy) continue;

          const dx = enemy.x - unit.x;
          const dy = enemy.y - unit.y;
          const dist = Math.hypot(dx, dy);

          if (dist <= unit.range) {
            unit.hp -= 12 * (1 / 60);
            enemy.hp -= 10 * (1 / 60);
            if (enemy.hp <= 0) {
              const idx = units.indexOf(enemy);
              if (idx >= 0) units.splice(idx, 1);
            }
          } else {
            const angle = Math.atan2(dy, dx);
            unit.x += Math.cos(angle) * unit.speed * (1 / 60);
            unit.y += Math.sin(angle) * unit.speed * (1 / 60);
          }
        }

        for (let i = units.length - 1; i >= 0; i--) {
          if (units[i].hp <= 0) units.splice(i, 1);
        }

        renderUnits();
        updateSelectedInfo();
      }

      function renderUnits() {
        unitsLayer.innerHTML = units.map((u) => {
          const selected = selectedUnitId === u.id ? 'selected' : '';
          const hpPercent = (u.hp / u.maxHp) * 100;
          return `
            <div class="unit ${u.color} ${selected}" style="left:${u.x}px; top:${u.y}px;" data-unit-id="${u.id}">
              <span>${u.type === 'tank' ? 'T' : 'I'}</span>
              <span class="name">${u.name}</span>
              <span class="hp" style="width:${Math.max(26, hpPercent * 0.6)}px; text-align:center;">${Math.ceil(u.hp)}</span>
            </div>
          `;
        }).join('');

        document.querySelectorAll('.unit').forEach((el) => {
          el.addEventListener('click', (event) => {
            event.stopPropagation();
            selectedUnitId = el.dataset.unitId;
            updateSelectedInfo();
            renderUnits();
          });
        });
      }

      function onBattlefieldClick(event) {
        const rect = event.currentTarget.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;

        if (!selectedUnitId) return;

        const unit = getUnitById(selectedUnitId);
        if (!unit) return;

        unit.x = x;
        unit.y = y;
        renderUnits();
        updateSelectedInfo();
      }

      document.getElementById('battlefield').addEventListener('click', onBattlefieldClick);

      function gameLoop(ts) {
        if (!lastTime) lastTime = ts;
        const delta = (ts - lastTime) / 1000;
        lastTime = ts;

        updateUnits(delta);
        requestAnimationFrame(gameLoop);
      }

      renderMap();
      renderPlayers();
      startHeureH();
      renderUnits();
      updateSelectedInfo();
      requestAnimationFrame(gameLoop);

      const ws = new WebSocket('ws://localhost:3010');
      ws.addEventListener('open', () => {
        if (roomId && userId) {
          ws.send(JSON.stringify({ type: 'register', userId, username: 'Joueur' }));
        }
      });

      document.getElementById('endMatchBtn').addEventListener('click', () => {
        ws.send(JSON.stringify({ type: 'end-match', winnerId: userId || 'local' }));
      });
    </script>
  </body>
</html>
