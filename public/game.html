<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Zero Hour Game</title>
    <style>
      :root {
        --bg-dark: #0b1120;
        --bg-panel: rgba(15, 23, 42, 0.92);
        --panel-border: rgba(148, 163, 184, 0.2);
        --accent: #38bdf8;
        --accent-2: #22c55e;
        --danger: #ef4444;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --ground: #16324a;
        --ground-3: #1f3a52;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #14233b 0%, var(--bg-dark) 45%);
        color: var(--text);
        font-family: Arial, sans-serif;
      }

      #game-shell {
        display: grid;
        grid-template-columns: 1fr 360px;
        gap: 16px;
        width: 100%;
        min-height: 100vh;
        padding: 18px;
      }

      #game-area {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      #hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 18px;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid var(--panel-border);
        border-radius: 14px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
      }

      .hud-left, .hud-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.12);
        border: 1px solid rgba(56, 189, 248, 0.35);
        color: var(--accent);
        font-size: 12px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .danger-tag {
        background: rgba(239, 68, 68, 0.12);
        border-color: rgba(239, 68, 68, 0.35);
        color: #fca5a5;
      }

      h1 {
        margin: 0;
        font-size: 1.2rem;
      }

      #battlefield {
        position: relative;
        flex: 1;
        min-height: 560px;
        border-radius: 18px;
        overflow: hidden;
        background:
          linear-gradient(135deg, rgba(18, 74, 92, 0.8), rgba(6, 28, 42, 0.9)),
          repeating-linear-gradient(
            0deg,
            rgba(255,255,255,0.02),
            rgba(255,255,255,0.02) 2px,
            transparent 2px,
            transparent 22px
          );
        border: 1px solid var(--panel-border);
        box-shadow: inset 0 0 16px rgba(56, 189, 248, 0.12);
      }

      #battlefield::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 30% 30%, rgba(34, 197, 94, 0.12), transparent 25%),
          radial-gradient(circle at 70% 65%, rgba(56, 189, 248, 0.1), transparent 28%);
      }

      .terrain-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
        background-size: 32px 32px;
      }

      .unit {
        position: absolute;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: 3px solid rgba(255,255,255,0.8);
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: bold;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.35);
        transform: translate(-50%, -50%);
        z-index: 2;
      }

      .unit .name {
        display: block;
        margin-top: 32px;
        background: rgba(15, 23, 42, 0.8);
        padding: 2px 5px;
        border-radius: 999px;
        font-size: 9px;
        white-space: nowrap;
      }

      .unit.me {
        border-color: #f8fafc;
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.75);
      }

      .unit.enemy {
        border-color: rgba(254, 202, 202, 0.85);
      }

      #sidebar {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .panel {
        background: var(--bg-panel);
        border: 1px solid var(--panel-border);
        border-radius: 14px;
        padding: 14px 16px;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
      }

      .panel h3 {
        margin: 0 0 10px 0;
        font-size: 1rem;
      }

      #playersList {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      #playersList li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 10px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.7);
      }

      #playersList li.me {
        border-color: rgba(56, 189, 248, 0.6);
      }

      .player-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .avatar {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: inline-block;
        background: linear-gradient(135deg, #38bdf8, #2563eb);
        box-shadow: 0 0 8px rgba(56, 189, 248, 0.45);
      }

      .player-meta span {
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .player-state {
        font-size: 10px;
        padding: 4px 7px;
        border-radius: 999px;
        background: rgba(34, 197, 94, 0.12);
        border: 1px solid rgba(34, 197, 94, 0.35);
        color: #86efac;
      }

      .player-state.waiting {
        background: rgba(148, 163, 184, 0.12);
        border-color: rgba(148, 163, 184, 0.35);
        color: #cbd5e1;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 12px;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        cursor: pointer;
        font-weight: bold;
      }

      button:hover { filter: brightness(1.06); }

      .warning {
        color: #fca5a5;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="game-shell">
      <div id="game-area">
        <header id="hud">
          <div class="hud-left">
            <h1>Zero Hour</h1>
            <span id="roomLabel" class="tag">Room</span>
            <span id="mapLabel" class="tag">Map</span>
          </div>
          <div class="hud-right">
            <span id="stateLabel" class="tag">Partie lancée</span>
            <span id="statusLabel" class="tag danger-tag">LIVE</span>
          </div>
        </header>

        <div id="battlefield">
          <div class="terrain-grid"></div>
          <div id="battlefieldUnits"></div>
        </div>
      </div>

      <aside id="sidebar">
        <div class="panel">
          <h3>Joueurs</h3>
          <ul id="playersList"></ul>
        </div>

        <div class="panel">
          <h3>Objectif</h3>
          <p class="warning">Contrôlez le terrain, éliminez les cibles et protégez votre zone.</p>
        </div>

        <div class="panel">
          <h3>Actions</h3>
          <button id="endMatchBtn">Terminer la partie</button>
        </div>
      </aside>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const roomId = params.get('roomId');
      const userId = params.get('userId');

      const roomLabel = document.getElementById('roomLabel');
      const mapLabel = document.getElementById('mapLabel');
      const stateLabel = document.getElementById('stateLabel');
      const playersList = document.getElementById('playersList');
      const battlefieldUnits = document.getElementById('battlefieldUnits');
      const statusLabel = document.getElementById('statusLabel');

      const palette = ['#38bdf8', '#34d399', '#fbbf24', '#f472b6', '#c084fc', '#fb7185'];

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function renderPlayers(room) {
        const players = room && room.players ? room.players : [];

        playersList.innerHTML = players.map((player, index) => {
          const isMe = player.userId === userId;
          const color = palette[index % palette.length];
          const status = player.ready ? 'Ready' : 'Waiting';

          return `
            <li class="${isMe ? 'me' : ''}">
              <div class="player-meta">
                <span class="avatar" style="background:${color};"></span>
                <span>${escapeHtml(player.username || 'Joueur')}</span>
              </div>
              <span class="player-state ${player.ready ? '' : 'waiting'}">${status}</span>
            </li>
          `;
        }).join('') || '<li><span class="warning">Aucun joueur dans la room.</span></li>';
      }

      function renderBattlefield(room) {
        const players = room && room.players ? room.players : [];

        battlefieldUnits.innerHTML = players.map((player, index) => {
          const x = 18 + ((index * 22) % 70);
          const y = 24 + ((index * 19) % 52);
          const color = palette[index % palette.length];
          const isMe = player.userId === userId;
          const label = (player.username || 'J').slice(0, 2).toUpperCase();

          return `
            <div class="unit ${isMe ? 'me' : 'enemy'}" style="left:${x}%; top:${y}%; background:${color};">
              <span>${label}</span>
              <span class="name">${escapeHtml(player.username || 'Joueur')}</span>
            </div>
          `;
        }).join('');
      }

      function renderRoom(room) {
        const safeRoom = room || { id: roomId, status: 'playing', mapId: 'map_01', players: [] };

        roomLabel.textContent = safeRoom.id || roomId || 'Room';
        mapLabel.textContent = safeRoom.mapId || 'map_01';
        stateLabel.textContent = safeRoom.status === 'playing' ? 'Partie lancée' : safeRoom.status || 'Partie lancée';
        statusLabel.textContent = safeRoom.status === 'playing' ? 'LIVE' : 'WAIT';

        renderPlayers(safeRoom);
        renderBattlefield(safeRoom);
      }

      roomLabel.textContent = roomId || 'Room';
      mapLabel.textContent = 'map_01';
      stateLabel.textContent = 'Partie lancée';

      const ws = new WebSocket('ws://localhost:3010');

      ws.addEventListener('open', () => {
        if (userId) {
          ws.send(JSON.stringify({
            type: 'register',
            userId,
            username: 'Joueur'
          }));
        }

        if (roomId) {
          ws.send(JSON.stringify({
            type: 'join-room',
            roomId,
            userId,
            username: 'Joueur'
          }));
        }
      });

      ws.addEventListener('message', (event) => {
        const data = JSON.parse(event.data);
        console.log('game message', data);

        if (data.type === 'registered') {
          console.log('registered in game', data.userId);
        }

        if (data.type === 'joined-room' || data.type === 'room-update' || data.type === 'match-started') {
          renderRoom(data.room);
        }

        if (data.type === 'match-ended') {
          renderRoom(data.room);
          stateLabel.textContent = 'Partie terminée';
          statusLabel.textContent = 'END';
          statusLabel.classList.remove('danger-tag');
        }
      });

      ws.addEventListener('error', () => {
        stateLabel.textContent = 'Serveur indisponible';
      });

      document.getElementById('endMatchBtn').addEventListener('click', () => {
        ws.send(JSON.stringify({
          type: 'end-match',
          winnerId: userId
        }));

        stateLabel.textContent = 'Partie terminée';
        statusLabel.textContent = 'END';
      });
    </script>
  </body>
</html>
