<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Zero Hour — visionneuse W3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #14181d; color: #dfe6ee; font: 14px system-ui, sans-serif; overflow: hidden; }
  #ui { position: fixed; top: 10px; left: 10px; z-index: 2; background: #0009; padding: 10px; border-radius: 8px; max-width: 420px; }
  #ui input { width: 260px; padding: 5px; }
  #info { margin-top: 8px; font-size: 12px; white-space: pre-wrap; max-height: 22vh; overflow: auto; }
  #meshes { margin-top: 8px; font-size: 11px; max-height: 34vh; overflow: auto; border-top: 1px solid #fff3; padding-top: 6px; }
  #meshes label { display: block; white-space: nowrap; cursor: pointer; padding: 1px 2px; }
  #meshes label.sel { background: #2b6cb0; }
  #meshes .off { opacity: .5; }
  #tools { margin-top: 6px; font-size: 12px; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <input id="obj" list="objs" placeholder="Object (ex. AmericaTankCrusader)" autocomplete="off">
  <datalist id="objs"></datalist>
  <button id="go">Charger</button>
  <div id="info">Chargement de la liste…</div>
  <div id="tools">
    <button id="copy">Copier le rapport</button>
    <button id="door">Tester la porte</button>
    <label><input type="checkbox" id="texV"> inverser V</label>
    <label><input type="checkbox" id="texU"> miroir U</label>
  </div>
  <div id="meshes"></div>
</div>
<script type="module" src="/viewer.js"></script>
</body>
</html>
